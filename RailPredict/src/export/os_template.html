<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RailPredict OS</title>
<!-- Proprietary demo — keep out of search indexes. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="RailPredict OS — an intelligent buffer for UK rail data: local delay prediction, full-journey capture, and a live operator/network view.">
<meta property="og:type" content="website">
<meta property="og:title" content="RailPredict OS">
<meta property="og:description" content="An intelligent buffer for UK rail data — local delay prediction, full-journey capture, and a live operator/network view.">
<meta property="og:image" content="https://mikolaj-mikuliszyn.dev/og/railpredict-os.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RailPredict OS">
<meta name="twitter:description" content="An intelligent buffer for UK rail data — local delay prediction, full-journey capture, and a live operator/network view.">
<meta name="twitter:image" content="https://mikolaj-mikuliszyn.dev/og/railpredict-os.png">
<meta name="theme-color" content="#0f172a">
<style>
  /* ── Design tokens ─────────────────────────────────────────────── */
  :root {
    --ink: #0f172a; --muted: #475569; --dim: #94a3b8; --line: #e5e7eb; --soft: #f7f8fa;
    --accent: #2563eb; --accent-ink: #1e3a8a; --good: #16a34a;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --mb-h: 28px;
    --dock-h: 70px;
    --win-radius: 11px;
    --win-shadow: 0 24px 80px rgba(0,0,0,.55), 0 4px 16px rgba(0,0,0,.35);
  }

  /* ── Reset ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  /* ── Desktop ───────────────────────────────────────────────────── */
  body {
    background: radial-gradient(ellipse at 30% 20%, #1a3a5c 0%, #0d1f35 45%, #070c14 100%);
    color: #f1f5f9;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  #desktop { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ── Menu bar ──────────────────────────────────────────────────── */
  #menubar {
    flex: 0 0 var(--mb-h);
    height: var(--mb-h);
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border-bottom: 1px solid rgba(255,255,255,.12);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 0;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,.92);
    z-index: 9000;
  }
  #menubar .brand {
    font-weight: 700;
    font-size: 13px;
    margin-right: 16px;
    letter-spacing: -.01em;
  }
  #menubar .brand .dot { color: #34d399; }
  #menubar .menu-items { display: flex; gap: 1px; }
  #menubar .menu-items span {
    padding: 2px 9px;
    border-radius: 4px;
    cursor: default;
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,.82);
    transition: background .1s;
  }
  #menubar .menu-items span:hover { background: rgba(255,255,255,.14); }
  #menubar .menu-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,.82);
  }
  #os-clock { font-variant-numeric: tabular-nums; }
  #menubar .brand-os { font-weight: 400; opacity: .55; margin-left: 1px; }
  .mb-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,.72);
    padding-right: 4px;
  }
  .mb-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #34d399; box-shadow: 0 0 6px #34d399;
    animation: mbpulse 2.4s ease-in-out infinite;
  }
  @keyframes mbpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  /* ── Boot cue: pulse the Map dock tile + a fading hint pill ────── */
  .dock-item.cue .app-ico { animation: cueGlow 1.8s ease-out infinite; }
  @keyframes cueGlow {
    0%   { box-shadow: 0 2px 7px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 0 rgba(96,165,250,.7); }
    70%  { box-shadow: 0 2px 7px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 11px rgba(96,165,250,0); }
    100% { box-shadow: 0 2px 7px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 0 rgba(96,165,250,0); }
  }
  .boot-hint {
    position: absolute; left: 50%; bottom: calc(var(--dock-h) + 4px);
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px;
    background: rgba(8,20,36,.82);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(127,178,232,.34);
    color: #cfe6ff; font-size: 12px; font-weight: 600;
    padding: 7px 15px; border-radius: 20px;
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
    z-index: 8500; pointer-events: none;
    opacity: 0; animation: hintIn .5s ease .7s forwards;
  }
  .boot-hint .hl { color: #9ec3ef; }
  .boot-hint .arr { font-weight: 800; }
  .boot-hint.gone { opacity: 0; transform: translateX(-50%) translateY(6px); transition: opacity .4s, transform .4s; animation: none; }
  @keyframes hintIn { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .mb-dot { animation: none; }
    .dock-item.cue .app-ico { animation: none; }
    .boot-hint { animation: none; opacity: 1; }
  }

  /* ── Desktop icon grid ─────────────────────────────────────────── */
  #desktop-icons {
    position: absolute;
    top: calc(var(--mb-h) + 20px);
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
  }
  .desk-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 72px;
    cursor: pointer;
    border-radius: 8px;
    padding: 6px 4px;
    transition: background .12s;
  }
  .desk-icon:hover { background: rgba(255,255,255,.1); }
  .desk-icon:active { background: rgba(255,255,255,.18); transform: scale(.96); }
  .desk-icon .icon-glyph {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  .desk-icon .icon-label {
    font-size: 10.5px;
    font-weight: 500;
    color: rgba(255,255,255,.9);
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70px;
  }

  /* ── Window layer ─────────────────────────────────────────────── */
  #windows {
    position: absolute;
    top: var(--mb-h);
    left: 0;
    right: 0;
    bottom: var(--dock-h);
  }

  /* ── Window chrome ────────────────────────────────────────────── */
  .win {
    position: absolute;
    background: #fff;
    border-radius: var(--win-radius);
    box-shadow: var(--win-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 320px;
    min-height: 200px;
    transition: box-shadow .15s, transform .19s cubic-bezier(.2,.8,.25,1), opacity .19s ease;
    transform-origin: center center;
  }
  .win:focus-within { box-shadow: 0 28px 90px rgba(0,0,0,.65), 0 6px 20px rgba(0,0,0,.4); }
  /* Lifecycle animation states (toggled by os_shell.js). */
  .win.opening     { transform: scale(.92) translateY(8px); opacity: 0; }
  .win.closing     { transform: scale(.94) translateY(4px); opacity: 0; pointer-events: none; }
  .win.minimising  { transform: scale(.42) translateY(42vh); opacity: 0; pointer-events: none; transform-origin: bottom center; }
  @media (prefers-reduced-motion: reduce) {
    .win { transition: box-shadow .15s; }
    .win.opening, .win.closing, .win.minimising { transform: none; opacity: 1; }
  }
  .win.min { display: none; }
  .win.max {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 0;
  }
  .win-bar {
    flex: 0 0 36px;
    height: 36px;
    background: #ececec;
    display: flex;
    align-items: center;
    padding: 0 12px;
    cursor: default;
    border-bottom: 1px solid rgba(0,0,0,.1);
    position: relative;
    border-radius: var(--win-radius) var(--win-radius) 0 0;
    user-select: none;
  }
  .win.max .win-bar { border-radius: 0; }
  .win-bar .traffic { display: flex; gap: 7px; align-items: center; position: relative; z-index: 1; }
  .win-bar .traffic button {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    padding: 0;
    position: relative;
    transition: filter .1s;
  }
  .win-bar .traffic button:hover { filter: brightness(.8); }
  .win-bar .traffic .t-close  { background: #fe5f57; }
  .win-bar .traffic .t-min    { background: #febc2e; }
  .win-bar .traffic .t-max    { background: #28c840; }
  .win-bar .traffic button .tt {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: rgba(0,0,0,.5); opacity: 0; transition: opacity .1s; line-height: 1;
  }
  .win-bar .traffic button:hover .tt { opacity: 1; }
  .win-title {
    position: absolute; left: 0; right: 0; text-align: center;
    font: 600 12.5px var(--sans); color: #2d2d2d;
    pointer-events: none;
  }
  .win-body {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: #f7f8fa;
  }
  /* Drag-to-resize grip, bottom-right corner */
  .win-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    cursor: nwse-resize;
    z-index: 6;
    background:
      linear-gradient(135deg, transparent 0 50%, rgba(120,140,170,.55) 50% 60%, transparent 60% 72%, rgba(120,140,170,.55) 72% 82%, transparent 82%);
    border-bottom-right-radius: var(--win-radius);
  }
  .win.max .win-resize { display: none; }

  /* ── Dock ─────────────────────────────────────────────────────── */
  #dock {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    height: calc(var(--dock-h) - 12px);
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
    z-index: 8000;
  }
  .dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    padding: 4px 6px 0;
    border-radius: 10px;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), background .1s;
    position: relative;
  }
  .dock-item:hover { transform: scale(1.22) translateY(-4px); background: rgba(255,255,255,.12); }
  .dock-item:active { transform: scale(1.05); }
  .dock-item .d-glyph {
    font-size: 28px; line-height: 1;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.45));
  }
  .dock-item .d-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    opacity: 0;
    transition: opacity .15s;
    margin-top: 1px;
  }
  .dock-item.running .d-dot { opacity: 1; }
  .dock-divider {
    width: 1px; height: 36px;
    background: rgba(255,255,255,.2);
    margin: 0 4px;
  }

  /* ── App icon tiles (crafted SVG, replaces emoji) ─────────────── */
  .app-ico {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 7px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28);
    flex-shrink: 0;
  }
  .app-ico svg {
    width: 18px; height: 18px;
    color: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }
  .app-ico.lg { width: 36px; height: 36px; border-radius: 9px; }
  .app-ico.lg svg { width: 22px; height: 22px; }
  .app-ico.xl { width: 52px; height: 52px; border-radius: 13px; }
  .app-ico.xl svg { width: 30px; height: 30px; }
  /* Per-app gradient — cohesive cool palette + one warm accent + neutral. */
  .tile-map         { background: linear-gradient(160deg, #4f9dff, #1d4ed8); }
  .tile-operators   { background: linear-gradient(160deg, #25c8d6, #0e7490); }
  .tile-predictions { background: linear-gradient(160deg, #7f86ff, #4338ca); }
  .tile-reliability { background: linear-gradient(160deg, #34d39a, #0f9d63); }
  .tile-replay      { background: linear-gradient(160deg, #fbbf3b, #e08507); }
  .tile-about       { background: linear-gradient(160deg, #8e9bb0, #475569); }

  /* ── "Coming soon" placeholder ────────────────────────────────── */
  .soon-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: #475569;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .soon-body .soon-icon { font-size: 42px; opacity: .6; }
  .soon-body .soon-title { font: 700 17px var(--sans); color: #1e293b; }
  .soon-body .soon-sub {
    font: 400 13px var(--sans); color: #64748b;
    text-align: center; max-width: 260px; line-height: 1.5;
  }
  .soon-body .soon-tag {
    margin-top: 8px; font: 600 10px var(--mono); color: #94a3b8;
    text-transform: uppercase; letter-spacing: .06em;
  }

  /* ── App views: shared applet scaffold ────────────────────────── */
  .win-body .applet {
    padding: 22px 24px;
    overflow: auto;
    height: 100%;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .win-body .applet-h {
    font: 800 18px var(--sans);
    color: var(--ink);
    letter-spacing: -.02em;
    margin-bottom: 3px;
  }
  .win-body .applet-sub {
    font: 400 12.5px var(--sans);
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.5;
    max-width: 520px;
  }
  .win-body .applet-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .win-body .kcard-sm {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 13px;
    min-width: 110px;
  }
  .win-body .kcard-sm .n { font: 800 19px var(--sans); color: var(--accent-ink); }
  .win-body .kcard-sm .l { font: 600 9px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; }

  /* ── Operator bar rows ─────────────────────────────────────────── */
  .win-body .op-row {
    display: grid;
    grid-template-columns: 8px 1fr auto auto;
    align-items: center;
    gap: 0 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px 12px;
    margin-bottom: 6px;
  }
  .win-body .op-swatch {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .win-body .op-name {
    font: 600 12.5px var(--sans);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .win-body .op-pct {
    font: 700 12px var(--mono);
    color: var(--accent-ink);
    white-space: nowrap;
  }
  .win-body .op-journeys {
    font: 500 10.5px var(--mono);
    color: var(--dim);
    white-space: nowrap;
  }
  .win-body .op-rank {
    font: 600 10px var(--mono);
    color: var(--dim);
    text-align: right;
    padding-left: 4px;
  }

  /* ── Operator league rows (ranked bar chart) ───────────────────── */
  .win-body .op-lrow {
    display: grid;
    grid-template-columns: 20px minmax(96px, 168px) 1fr 42px 60px;
    align-items: center; gap: 0 11px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--line);
  }
  .win-body .op-lrow:last-child { border-bottom: none; }
  .win-body .op-lrow .op-rank { font: 700 11px var(--mono); color: var(--dim); text-align: right; padding: 0; }
  .win-body .op-lrow.top .op-rank { color: var(--accent); }
  .win-body .op-lrow .op-name { font: 600 12.5px var(--sans); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-body .op-bar { height: 8px; background: #eef1f5; border-radius: 5px; overflow: hidden; }
  .win-body .op-bar-fill { display: block; height: 100%; border-radius: 5px; transition: width .3s ease; }
  .win-body .op-lrow .op-pct { font: 700 12px var(--mono); color: var(--ink); text-align: right; white-space: nowrap; }
  .win-body .op-jn { font: 500 10.5px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; }

  /* ── Reliability: recovery/punctuality gauges + hourly profile ─── */
  .win-body .gauge-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
  .win-body .gauge { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
  .win-body .gauge .g-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px; }
  .win-body .gauge .g-lbl { font: 600 10.5px var(--sans); color: var(--muted); }
  .win-body .gauge .g-val { font: 800 18px var(--sans); color: var(--accent-ink); letter-spacing: -.02em; }
  .win-body .gauge .g-track { height: 8px; background: #eef1f5; border-radius: 5px; overflow: hidden; }
  .win-body .gauge .g-fill { height: 100%; border-radius: 5px; transition: width .35s ease; }
  .win-body .hourly { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 14px 14px 10px; margin-bottom: 6px; }
  .win-body .hourly .hh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .win-body .hourly .hh b { font: 800 11px var(--sans); color: var(--ink); }
  .win-body .hourly .hh span { font: 500 10.5px var(--sans); color: var(--dim); }
  .win-body .hours { display: grid; grid-template-columns: repeat(24, 1fr); align-items: end; gap: 2px; height: 88px; }
  .win-body .hours .hbar { width: 100%; border-radius: 2px 2px 0 0; min-height: 2px; align-self: end; }
  .win-body .hours-axis { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin-top: 5px; }
  .win-body .hours-axis span { font: 600 7px var(--mono); color: var(--dim); text-align: center; }

  /* ── Predictions: signed-error histogram ───────────────────────── */
  .win-body .histo { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 14px 14px 12px; margin-bottom: 16px; }
  .win-body .histo .hh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .win-body .histo .hh b { font: 800 11px var(--sans); color: var(--ink); }
  .win-body .histo .hh span { font: 500 10.5px var(--sans); color: var(--dim); }
  .win-body .histo-bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 10px; height: 132px; }
  .win-body .hcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .win-body .hcol .hval { font: 700 9.5px var(--mono); color: var(--muted); margin-bottom: 4px; }
  .win-body .hcol .hbar2 { width: 100%; max-width: 38px; border-radius: 3px 3px 0 0; min-height: 3px; }
  .win-body .hcol .hlbl { font: 600 8.5px var(--mono); color: var(--dim); white-space: nowrap; margin-top: 5px; }
  .win-body .section-label {
    font: 800 9.5px var(--mono);
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin: 16px 0 8px;
  }
  .win-body .applet-note {
    font: 400 11px var(--sans);
    color: var(--dim);
    line-height: 1.55;
    margin-top: 14px;
  }

  /* ── Replay two-zone board ─────────────────────────────────────── */
  .win-body .replay-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 12px;
  }
  .win-body .replay-zone-h {
    font: 800 9.5px var(--mono);
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .win-body .replay-zone-h::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
  }
  .win-body .replay-zone-h.t::before { background: var(--accent); }
  .win-body .replay-zone-h.s::before { background: var(--good); }
  .win-body .rp-counter {
    font: 600 10.5px var(--mono);
    color: var(--dim);
    margin-left: auto;
  }

  /* ── About page ────────────────────────────────────────────────── */

<!-- ── Predictions app ────────────────────────────────────────────── -->
<template id="app-predictions">
  <div class="applet">
    <div class="applet-h">Prediction accuracy</div>
    <div class="applet-sub">How well the LightGBM models forecast arrival delay — measured against every finalised service where a prediction was made and the actual outcome was recorded.</div>
    <div class="applet-row">
      <div class="kcard-sm"><div class="n" data-fill="mae_mins" data-suffix="m">—</div><div class="l">mean abs. error</div></div>
      <div class="kcard-sm"><div class="n" data-fill="within_5_pct" data-suffix="%">—</div><div class="l">predictions within 5 min</div></div>
      <div class="kcard-sm"><div class="n" data-fill="on_time_pct" data-suffix="%">—</div><div class="l">on time (≤5 min)</div></div>
    </div>
    <div class="histo">
      <div class="hh"><b>Prediction error distribution</b><span>predicted minus actual delay (min) — clustered on zero is accurate &amp; unbiased</span></div>
      <div class="histo-bars" id="pred-histo"></div>
    </div>
    <div class="about-section">
      <h3>How predictions work</h3>
      <p>Two models run in tandem: a <b>day-ahead</b> model that forecasts delay from timetable features and historical patterns, and a <b>real-time</b> model that updates as live Darwin messages arrive. Both export to ONNX and run locally — no round-trips to an external inference server.</p>
      <p>The engine blends the model output with preceding-service correlation (when a train on the same origin within ±20 min is delayed, downstream trains inherit a weighted signal) and applies weather-driven volatility from the Open-Meteo wind feed.</p>
    </div>
    <div class="applet-note">Accuracy is measured on finalised services only. Services with no recorded actual outcome are excluded from all statistics above.</div>
  </div>
</template>

<!-- ── About app ──────────────────────────────────────────────────── -->
<template id="app-about">
  <div class="applet">
    <div class="applet-h">About RailPredict</div>
    <div class="applet-sub">A prediction engine for UK rail delays — it turns the live Darwin firehose into accurate, measured delay intelligence, and surfaces it instantly.</div>

    <div class="about-stats">
      <div class="stat"><b id="ab-journeys">—</b><span>journeys shadowed</span></div>
      <div class="stat"><b id="ab-calls">—</b><span>calling points</span></div>
      <div class="stat"><b id="ab-preds">—</b><span>predictions scored</span></div>
      <div class="stat"><b id="ab-mae">—</b><span>mean error</span></div>
      <div class="stat"><b id="ab-within5">—</b><span>within 5 min</span></div>
      <div class="stat"><b id="ab-ontime">—</b><span>on time</span></div>
    </div>
    <div class="about-day">Yesterday · <span id="ab-date">—</span> · accuracy measured, not claimed</div>

    <div class="about-flow">
      <span>Capture</span><i>→</i><span>Relate</span><i>→</i><span>Model</span><i>→</i><span>Predict</span><i>→</i><span>Surface</span>
    </div>

    <div class="about-section">
      <h3>What we capture — and why</h3>
      <p>RailPredict shadows National Rail's Darwin push-port: every movement message for every train, live. From those fragmentary messages it reconstructs each service's <b>full journey</b> — every calling point, scheduled vs actual time, platform, and cancellation — and enriches it with weather on the route. The timetable says what <em>should</em> happen; this records what actually <em>does</em>. That record is the corpus the model learns from.</p>
    </div>

    <div class="about-section">
      <h3>The relationships it learns</h3>
      <p>Delay isn't random — it's structured, and the engine models the structure:</p>
      <ul class="about-rel">
        <li><b>Service identity</b> — it tracks the <em>recurring</em> service (same working timetable, weekday, origin, hour), not the one-off daily train, so it learns each service's true character.</li>
        <li><b>Knock-on</b> — a late preceding service on the same route shifts the next one's forecast, blended within a ±20-minute window.</li>
        <li><b>Cascade</b> — delay propagates along shared track, tracked through a live location index.</li>
        <li><b>Volatility</b> — high winds on a corridor raise the alert level for every service on it.</li>
      </ul>
    </div>

    <div class="about-highlight">
      <h3>The model — the core of the IP</h3>
      <p>Two gradient-boosted models (LightGBM, compiled to ONNX): a <b>day-ahead</b> model for planning and a <b>real-time</b> model that folds in eight live signals as a service runs. Both are trained on the captured delay corpus and sample-weighted so the rare, costly severe delays aren't drowned out by the on-time majority. Inference is local and sub-millisecond — no per-query API cost.</p>
    </div>

    <div class="about-section">
      <h3>Predictions, scored against reality</h3>
      <p>Every service gets a predicted delay and a confidence that decays as its data ages. Crucially, each prediction is <b>logged and later matched to the real outcome</b> — so accuracy is measured, not asserted. The numbers above are yesterday's, straight from that ledger.</p>
    </div>

    <div class="about-section">
      <h3>The dashboard</h3>
      <p>All of it surfaces instantly — the live map replaying a full day across the network, the operator league, the predicted-vs-actual replay, station reliability. That's the value: delay intelligence the moment it matters. Wire in a ticketing feed and the same engine drives proactive rebooking, point-of-sale reliability scores, and automated Delay Repay.</p>
    </div>

    <div class="about-footer">
      Generated <span data-fill="generated_at">—</span> · the model, the engine, and this dashboard — one Rust + Docker appliance · Darwin data © Network Rail
    </div>
  </div>
</template>
