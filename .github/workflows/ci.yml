name: CI

on:
  # Run on pushes to the default branch (incl. PR merges) and on every pull request,
  # but NOT on every push to feature branches.
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railpredict
          POSTGRES_PASSWORD: railpredict
          POSTGRES_DB: railpredict
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://railpredict:railpredict@localhost:5432/railpredict

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # cargo-deny runs independently — no Rust toolchain needed.
      # Install it before the toolchain setup so both can run in parallel conceptually,
      # but sequentially here for simplicity.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@latest

      - name: Dependency audit (cargo deny)
        run: cargo deny check
        working-directory: RailPredict

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RailPredict

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
        working-directory: RailPredict
        env:
          DATABASE_URL: postgresql://railpredict:railpredict@localhost:5432/railpredict

      - name: Tests
        run: cargo test
        working-directory: RailPredict
        env:
          DATABASE_URL: postgresql://railpredict:railpredict@localhost:5432/railpredict

      - name: Release build
        run: cargo build --release
        working-directory: RailPredict
        env:
          DATABASE_URL: postgresql://railpredict:railpredict@localhost:5432/railpredict
