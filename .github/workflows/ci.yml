name: CI

on:
  # Run on pushes to the default branch (incl. PR merges) and on every pull request,
  # but NOT on every push to feature branches.
  push:
    branches: [main]
  pull_request:

jobs:
  # Dependency / licence audit — no Rust toolchain or database needed.
  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@latest

      - name: cargo deny check
        run: cargo deny check
        working-directory: RailPredict

  # Lint — compiles, but no DB (queries are runtime-checked, not the query! macro).
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RailPredict

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings
        working-directory: RailPredict

  # Tests — the only job that needs Postgres (sqlx db-integration tests connect at runtime).
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railpredict
          POSTGRES_PASSWORD: railpredict
          POSTGRES_DB: railpredict
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://railpredict:railpredict@localhost:5432/railpredict

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RailPredict

      - name: Tests
        run: cargo test
        working-directory: RailPredict

  # Release build — verifies the optimised binary compiles; no DB needed.
  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RailPredict

      - name: Release build
        run: cargo build --release
        working-directory: RailPredict
