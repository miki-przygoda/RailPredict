# cargo-deny configuration for RailPredict.
#
# Run locally:  cargo deny check
# Run in CI:    see .github/workflows/ci.yml "Dependency audit" step.
#
# This is a permissive starting configuration. Tighten over time as the
# dependency tree stabilises (particularly the `licenses` allow-list).

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # proc-macro-error is a transitive dep of maud v0.26.0 (via maud_macros); no safe upgrade
    # available upstream. Tracked in TODOs/TechnicalDebt.md — revisit when maud releases a
    # version that drops the dependency.
    { id = "RUSTSEC-2024-0370", reason = "transitive dep of maud v0.26.0 with no upstream fix" },
]

# The allow-list governs THIRD-PARTY DEPENDENCY licences only. RailPredict itself
# is proprietary (LicenseRef-Proprietary, publish = false); `private.ignore` keeps
# cargo-deny from evaluating the workspace crate against this permissive list.
[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"