# cargo-deny configuration for RailPredict.
#
# Run locally:  cargo deny check
# Run in CI:    see .github/workflows/ci.yml "Dependency audit" step.
#
# This is a permissive starting configuration. Tighten over time as the
# dependency tree stabilises (particularly the `licenses` allow-list).

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
copyleft = "warn"

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
